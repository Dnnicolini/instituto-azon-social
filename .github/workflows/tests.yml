name: tests

on:
  push:
    branches:
      - main
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Install dependencies
        run: |
          composer install --no-interaction --no-progress --prefer-dist
          npm ci

      - name: Prepare application
        run: |
          cp .env.example .env
          php artisan key:generate
          touch database/database.sqlite
          php artisan migrate --force
          php artisan storage:link

      - name: Build application
        run: npm run build:ssr

      - name: Run CI Checks
        run: composer ci:check

      - name: Run frontend unit tests
        run: npm exec vp test -- resources/js/components/seo-head.test.ts

      - name: Validate Azure deploy script syntax
        run: bash -n deploy/azure/deploy-from-github.sh deploy/azure/deploy-release.sh

      - name: Prepare browser tests
        run: |
          php artisan db:seed --force
          npx playwright install --with-deps chromium

      - name: Run browser tests
        run: npm run test:e2e
