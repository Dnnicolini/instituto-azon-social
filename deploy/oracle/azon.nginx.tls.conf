server {
    listen 80;
    listen [::]:80;
    server_name azonsocial.org.br www.azonsocial.org.br;

    return 301 https://azonsocial.org.br$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name admin.azonsocial.org.br;

    return 301 https://azonsocial.org.br/admin;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.azonsocial.org.br;

    ssl_certificate /etc/letsencrypt/live/azonsocial.org.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/azonsocial.org.br/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    return 301 https://azonsocial.org.br$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name admin.azonsocial.org.br;

    ssl_certificate /etc/letsencrypt/live/azonsocial.org.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/azonsocial.org.br/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    return 301 https://azonsocial.org.br/admin;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name azonsocial.org.br;

    ssl_certificate /etc/letsencrypt/live/azonsocial.org.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/azonsocial.org.br/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/apps/azon/current/public;
    index index.php;
    charset utf-8;

    client_max_body_size 10m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /index.php {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.4-fpm-azon.sock;
        fastcgi_read_timeout 60s;
    }

    location ~ \.php$ {
        return 404;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }

    location ~* \.(?:css|js|jpg|jpeg|gif|png|webp|avif|svg|ico|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    access_log /var/log/nginx/azon-access.log;
    error_log /var/log/nginx/azon-error.log;
}
