map $request_uri $azon_log_path {
    ~^([^?]*) $1;
    default $uri;
}

log_format azon_safe '$remote_addr - $remote_user [$time_local] '
                     '"$request_method $azon_log_path $server_protocol" $status $body_bytes_sent';

map $request_uri $azon_access_loggable {
    default 1;
    ~^/admin/(?:redefinir-senha/|verificar-email/) 0;
}

server {
    listen 80;
    listen [::]:80;
    server_name admin.azonsocial.org.br;
    access_log off;

    return 302 http://azonsocial.org.br$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name azonsocial.org.br www.azonsocial.org.br;

    root /var/www/apps/azon/current/public;
    index index.php;
    charset utf-8;
    client_max_body_size 210m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location ^~ /storage/cms/documents/ {
        return 404;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ ^/admin/(?:redefinir-senha/|verificar-email/) {
        access_log off;
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /index.php {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.4-fpm-azon.sock;
        fastcgi_read_timeout 60s;
    }

    location ~ \.php$ {
        return 404;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }

    location ~* \.(?:css|js|jpg|jpeg|gif|png|webp|avif|svg|ico|woff2?|mp4|mov|webm)$ {
        expires 30d;
        try_files $uri =404;
    }

    access_log /var/log/nginx/azon-access.log azon_safe if=$azon_access_loggable;
    error_log /var/log/nginx/azon-error.log;
}
