map $request_uri $azon_log_path {
    ~^([^?]*) $1;
    default $uri;
}

log_format azon_safe '$remote_addr - $remote_user [$time_local] '
                     '"$request_method $azon_log_path $server_protocol" $status $body_bytes_sent';

map $request_uri $azon_access_loggable {
    default 1;
    ~^/admin/(?:redefinir-senha/|verificar-email/) 0;
}

server {
    listen 80;
    listen [::]:80;
    server_name azonsocial.org.br www.azonsocial.org.br admin.azonsocial.org.br;
    access_log /var/log/nginx/azon-access.log azon_safe if=$azon_access_loggable;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.azonsocial.org.br;
    access_log /var/log/nginx/azon-access.log azon_safe if=$azon_access_loggable;

    ssl_certificate /etc/letsencrypt/live/azonsocial.org.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/azonsocial.org.br/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Referrer-Policy "no-referrer" always;
    return 301 https://azonsocial.org.br$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name admin.azonsocial.org.br;

    ssl_certificate /etc/letsencrypt/live/azonsocial.org.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/azonsocial.org.br/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/apps/azon/current/public;
    index index.php;
    charset utf-8;
    client_max_body_size 210m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location = / {
        return 302 /admin;
    }

    location ^~ /storage/cms/documents/ {
        return 404;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ ^/admin/(?:redefinir-senha/|verificar-email/) {
        access_log off;
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /index.php {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.4-fpm-azon.sock;
        fastcgi_read_timeout 60s;
        fastcgi_buffer_size 32k;
        fastcgi_buffers 8 32k;
        fastcgi_busy_buffers_size 64k;
    }

    location ~ \.php$ {
        return 404;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }

    location ~* \.(?:css|js|jpg|jpeg|gif|png|webp|avif|svg|ico|woff2?|mp4|mov|webm)$ {
        expires 30d;
        try_files $uri =404;
    }

    access_log /var/log/nginx/azon-admin-access.log azon_safe if=$azon_access_loggable;
    error_log /var/log/nginx/azon-admin-error.log;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name azonsocial.org.br;

    ssl_certificate /etc/letsencrypt/live/azonsocial.org.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/azonsocial.org.br/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/apps/azon/current/public;
    index index.php;
    charset utf-8;
    client_max_body_size 210m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location = /admin {
        return 302 https://admin.azonsocial.org.br/admin;
    }

    location ^~ /storage/cms/documents/ {
        return 404;
    }

    location ^~ /admin/ {
        access_log off;
        return 302 https://admin.azonsocial.org.br$request_uri;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /index.php {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.4-fpm-azon.sock;
        fastcgi_read_timeout 60s;
        fastcgi_buffer_size 32k;
        fastcgi_buffers 8 32k;
        fastcgi_busy_buffers_size 64k;
    }

    location ~ \.php$ {
        return 404;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }

    location ~* \.(?:css|js|jpg|jpeg|gif|png|webp|avif|svg|ico|woff2?|mp4|mov|webm)$ {
        expires 30d;
        try_files $uri =404;
    }

    access_log /var/log/nginx/azon-access.log azon_safe if=$azon_access_loggable;
    error_log /var/log/nginx/azon-error.log;
}
